name: 🔧 Build AFFT APK · soe1hom-arch

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - '.mailmap'
      - '.editorconfig'
      - 'CONTRIBUTING.md'
      - 'NOTICE'
      - 'docs/**'
      - 'push-to-github.sh'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          gradle-version: '8.14.2'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake build-essential cmake e2fsprogs liblzma-dev libtool pkg-config qemu-user

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.22.12'

      - name: Build licensed native tools from pinned sources
        env:
          SRC_DIR: ${{ github.workspace }}
          NDK_DIR: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: bash tools/build_licensed_binaries.sh

      - name: Test EROFS binaries under ARM64 emulation
        env:
          SRC_DIR: ${{ github.workspace }}
        run: bash tools/test_erofs_binaries.sh

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload APK as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
