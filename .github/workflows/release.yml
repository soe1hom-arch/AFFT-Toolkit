name: 📦 Release AFFT APK · soe1hom-arch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v2.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          gradle-version: '8.14.2'

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Error: Release tag must start with v followed by a version number."
            echo "Example: v2.1.1"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Decode keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-key.jks

      - name: Build Release APK
        shell: bash
        env:
          KEYSTORE_PATH: "release-key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Clean keystore
        if: always()
        shell: bash
        run: |
          if [ -f app/release-key.jks ]; then
            rm -f app/release-key.jks
          fi

      - name: Rename APK with version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          OUTPUT="app/build/outputs/apk/release/AFFT-Toolkit_${RELEASE_TAG}.apk"

          if [ ! -f "$APK" ]; then
            echo "Error: Release APK was not found:"
            echo "$APK"
            exit 1
          fi

          cp "$APK" "$OUTPUT"

          echo "APK created:"
          echo "$OUTPUT"

      - name: Generate release notes from CHANGELOG
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          CHANGELOG_VERSION="${RELEASE_TAG#v}"

          awk -v tag="[$CHANGELOG_VERSION]" '
            /^## / {
              if (found) exit
              if (index($0, tag)) found=1
            }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "## AFFT-Toolkit ${RELEASE_TAG}" > /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md
            echo "See [CHANGELOG](https://github.com/soe1hom-arch/AFFT-Toolkit/blob/main/CHANGELOG.md) for details." >> /tmp/release-notes.md
          fi

          echo "" >> /tmp/release-notes.md
          echo "---" >> /tmp/release-notes.md
          echo "[📖 README](https://github.com/soe1hom-arch/AFFT-Toolkit#readme) · [📋 Full Changelog](https://github.com/soe1hom-arch/AFFT-Toolkit/blob/main/CHANGELOG.md)" >> /tmp/release-notes.md

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          IS_PRERELEASE="false"

          if echo "$RELEASE_TAG" | grep -qiE "beta|alpha|rc|pre"; then
            IS_PRERELEASE="true"
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file /tmp/release-notes.md \
            --prerelease="$IS_PRERELEASE" \
            "app/build/outputs/apk/release/AFFT-Toolkit_${RELEASE_TAG}.apk"
